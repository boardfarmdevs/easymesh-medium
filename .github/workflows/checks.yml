# The medium's checks, without a lab: the patched wmediumd builds and passes its
# self-test, the configurator's tests pass and every room tree regenerates its
# goldens identically, the room viewer's and the topology page's tests pass, the console's
# Go tests pass and it builds. The site and the documentation check: pages.yml.
name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wmediumd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnl-3-dev libnl-genl-3-dev libconfig-dev pkg-config
      - name: Build (upstream at the pin, the patch series)
        run: wmediumd/build-wmediumd.sh
      - name: Self-test
        run: wmediumd/build/wmediumd -T
      - name: The offline build never fetches
        run: bash wmediumd/tests/test-offline-build.sh
      - name: Every log line stamped, the log bounded (patch 0038)
        run: bash wmediumd/tests/test-log-stamps.sh wmediumd/src/wmediumd/wmediumd.c
      - uses: actions/upload-artifact@v4
        with:
          name: wmediumd
          path: |
            wmediumd/build/wmediumd
            wmediumd/build/wmediumd.provenance.env

  lxd-monitoring:
    # the labs' LXD monitoring bundle: dashboards, Compose, scripts and the outer metrics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pytest pyyaml
      - run: python -m pytest -q lxd-monitoring/tests
  configurator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pytest
      - name: Tests (the RDK stack, and tests/prplmesh under the prplMesh stack)
        working-directory: configurator
        run: python -m pytest -q tests
      - name: The room trees regenerate their goldens identically
        working-directory: configurator
        run: |
          sh worlds/build-goldens.sh --check
          python worlds-wired/build-goldens.py --check
          python worlds-pods/build-goldens.py --check

  viewer:
    # the room viewer's tests that need no browser (configurator/tests/viewer); the browser
    # ones, and observer/tests, run in the labs' suites, which have Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: |
          for test in configurator/tests/viewer/*-test.js; do
            case $test in *browser-test.js|*sidebar-layout-test.js) continue ;; esac
            echo "== $test"
            node "$test"
          done

  topology-ui:
    # the controller's topology page (topology-ui): it assembles for both stacks and its tests
    # that need no browser pass; the browser ones run in the labs' suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -q pytest
      - name: Assemble
        run: |
          topology-ui/assemble.sh rdk "$RUNNER_TEMP/rdk"
          topology-ui/assemble.sh prplmesh "$RUNNER_TEMP/prplmesh"
      - name: Tests
        run: |
          topology-ui/tests/run.sh "$RUNNER_TEMP/rdk"
          topology-ui/tests/run.sh "$RUNNER_TEMP/prplmesh"
          python -m pytest -q topology-ui/tests

  observer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: observer/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: observer
        run: go test ./...
      - name: Build the console
        run: bash observer/build.sh
